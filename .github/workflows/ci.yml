name: YouTube Agent CI

'on':
push:
branches:
- main
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
test:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Check Python syntax
    run: python -m py_compile main.py

  - name: Test topic package
    run: |
      python - <<'PY'
      import json
      import tempfile
      import subprocess
      import sys
      from pathlib import Path

      output = Path(tempfile.gettempdir()) / "video_package.json"
      result = subprocess.run(
          [
              sys.executable,
              "main.py",
              "--topic",
              "AI for Beginners",
              "--output",
              str(output),
          ],
          capture_output=True,
          text=True,
      )

      assert result.returncode == 0, result.stderr
      data = json.loads(output.read_text(encoding="utf-8"))
      assert data["topic"] == "AI for Beginners"
      assert len(data["title_ideas"]) >= 3
      assert len(data["script_draft"]) >= 3
      assert len(data["scene_plan"]) >= 1
      assert data["publishing_status"] == "NOT_PUBLISHED"
      assert data["review_required"] is True
      print("PASS: topic package generated and validated")
      PY

  - name: Test empty topic validation
    run: |
      python - <<'PY'
      from main import create_video_package

      try:
          create_video_package("   ")
      except ValueError:
          print("PASS: empty topic rejected")
      else:
          raise AssertionError("Empty topic should be rejected")
      PY
